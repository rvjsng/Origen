name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: pip install numpy networkx matplotlib pandas
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the project screen can be rebuilt from recorded results
        run: python visualization/build_project_screen.py
