<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ORIGEN: topology-constrained search for inverse origami crease patterns. Research prototype.">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ORIGEN Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;800&display=swap">
<style>
/* Layout: lab-instrument project screen. Header + five tabs, content in cards on a cool grey ground.
   Mountain/valley use the origami convention (red dash-dot / violet dashed) and are separate from chart series colors. */
:root{
  --bg:#eef0f4; --surface:#fcfcfb; --paper:#ffffff; --ink:#0f1419; --ink2:#454d5a; --ink3:#69727f; --line:#d9dde4; --soft:#f2f4f7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --m:#d83a39; --v:#5b49d0;
  --good:#17703f; --good-bg:#e1f3e8; --bad:#b3302b; --bad-bg:#fbe6e4; --warn:#8a5a00; --warn-bg:#fcf0d4;
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101114; --surface:#1a1a19; --paper:#232322; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#9a998f; --line:#303133; --soft:#202122;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --m:#e66767; --v:#9085e9;
  --good:#6fd39a; --good-bg:#183324; --bad:#f08a85; --bad-bg:#3a1f1e; --warn:#e6b85a; --warn-bg:#3a2e12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101114; --surface:#1a1a19; --paper:#232322; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#9a998f; --line:#303133; --soft:#202122;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --m:#e66767; --v:#9085e9;
  --good:#6fd39a; --good-bg:#183324; --bad:#f08a85; --bad-bg:#3a1f1e; --warn:#e6b85a; --warn-bg:#3a2e12; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--body);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.4vw,38px);font-weight:800;line-height:1.05}
h2{font-size:19px;font-weight:800;line-height:1.2}
h3{font-size:14px;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

header{padding-block:22px 14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
header .sub{max-width:62ch;margin-top:8px;color:var(--ink2)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font:500 12px/1 var(--mono);padding:7px 10px;border-radius:4px;background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.badge.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}

nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:thin}
nav button{font:600 13px/1 var(--body);color:var(--ink2);background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.card h2+p,.card h3+p{margin-top:6px}
.note{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--line);padding:2px 0 2px 10px}
.callout{background:var(--warn-bg);color:var(--ink);border-radius:6px;padding:12px 14px;font-size:13px}
.callout b{color:var(--warn)}

.tile .big{font:800 34px/1.05 var(--display);letter-spacing:-.02em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:12.5px;color:var(--ink2)}

/* pipeline */
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-top:12px}
.step{flex:1 1 150px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px;position:relative;min-width:0}
.step b{display:block;font:600 13px/1.25 var(--body)}
.step span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.tag{display:inline-block;font:500 10.5px/1 var(--mono);padding:3px 6px;border-radius:3px;margin-top:7px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.tag.exact{color:var(--good);border-color:var(--good)} .tag.approx{color:var(--warn);border-color:var(--warn)}

/* crease svgs */
svg.cp{display:block;width:100%;height:auto;max-width:100%}
.paper{fill:var(--paper);stroke:var(--ink3);stroke-width:.6}
.cr{fill:none;stroke-width:1.15;stroke-linecap:round}
.cr.M{stroke:var(--m);stroke-dasharray:4 1.3 1 1.3} .cr.V{stroke:var(--v);stroke-dasharray:3 2} .cr.B{stroke:var(--ink3)}
.vt{fill:var(--ink)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.key i{display:inline-block;width:26px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.key i.m{border-color:var(--m);border-top-style:dashed} .key i.v{border-color:var(--v);border-top-style:dotted}

/* funnel + bars */
.row{display:grid;grid-template-columns:minmax(96px,170px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.track{height:14px;background:var(--soft);border-radius:2px;overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0}
.row .v{font:500 12px var(--mono);min-width:66px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px/1 var(--body);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.thumb[aria-pressed="true"]{border-color:var(--s1);box-shadow:0 0 0 1px var(--s1)}
.thumb .st{font:500 10.5px/1.2 var(--mono);margin-top:5px;display:block}
.st.pass{color:var(--good)} .st.fail{color:var(--bad)}
.pill{display:inline-flex;gap:6px;align-items:center;font:500 11.5px/1 var(--mono);padding:6px 8px;border-radius:4px}
.pill.pass{background:var(--good-bg);color:var(--good)} .pill.fail{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--soft);color:var(--ink2)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
td{font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}

/* charts */
.chart{position:relative;height:270px;width:100%}
.chart svg{display:block;width:100%;height:100%}
.ax text{font:11px var(--mono);fill:var(--ink3)}
.ax line,.grid line{stroke:var(--line);stroke-width:1}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 0 2px}
.lg i{display:inline-block;width:18px;height:0;border-top:3px solid;margin-right:6px;vertical-align:middle}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:5px;font:12px/1.45 var(--mono);display:none;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* 3d */
canvas#c3d{width:100%;height:320px;display:block;background:var(--soft);border-radius:5px;touch-action:none;cursor:grab}
input[type=range]{width:100%;accent-color:var(--s1)}
input[type=number]{width:78px;font:500 13px var(--mono);padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:600 12px/1 var(--body);padding:8px 11px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn[aria-pressed="true"]{background:var(--s1);color:#fff;border-color:var(--s1)}
code,pre{font-family:var(--mono);font-size:12px}
pre{background:var(--soft);padding:12px;border-radius:5px;overflow-x:auto;margin:8px 0 0}
ul.clean{margin:8px 0 0;padding-left:18px} ul.clean li{margin:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin-top:8px}
.kv dt{color:var(--ink3);font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding-top:2px} .kv dd{margin:0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}
</style>

function creaseSVG(p,label){
  const S0=p.paper_size,V=p.vertices,xs=[0,S0],ys=[0,S0];
  Object.values(V).forEach(([x,y])=>{xs.push(x);ys.push(y)});
  const x0=Math.min(...xs)-3,x1=Math.max(...xs)+3,y0=Math.min(...ys)-3,y1=Math.max(...ys)+3;
  const w=x1-x0,h=y1-y0,deg={};
  let lines='';
  for(const [u,v,a] of p.creases){deg[u]=(deg[u]||0)+1;deg[v]=(deg[v]||0)+1;
    const A=V[u],B=V[v];
    lines+=`<line class="cr ${a}" x1="${A[0]}" y1="${y1+y0-A[1]}" x2="${B[0]}" y2="${y1+y0-B[1]}"/>`;}
  let dots='';
  for(const k in deg){if(deg[k]>=3){const [x,y]=V[k];dots+=`<circle class="vt" cx="${x}" cy="${y1+y0-y}" r="1.7"/>`}}
  return `<svg class="cp" viewBox="${x0} ${y0} ${w} ${h}" role="img" aria-label="${esc(label||'Crease pattern')}"><rect class="paper" x="0" y="${y0+y1-S0}" width="${S0}" height="${S0}"/>${lines}${dots}</svg>`;
}

    let xa='';xt.forEach(t=>{xa+=`<text x="${sx(t)}" y="${H-m.b+16}" text-anchor="middle">${t}</text>`});
    let paths='',labs=[];
    o.series.forEach(s=>{
      const d=s.x.map((x,i)=>`${i?'L':'M'}${sx(x).toFixed(1)} ${sy(s.y[i]).toFixed(1)}`).join('');
      paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?2:2.4}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round"/>`;
      labs.push({y:sy(s.y[s.y.length-1]),t:s.short,c:s.color});
    });
    let lab='';
    if(o.endLabels){labs.sort((a,b)=>a.y-b.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<14)labs[i].y=labs[i-1].y+14;
      labs.forEach(l=>{lab+=`<text x="${W-m.r+8}" y="${l.y+4}" style="font:600 11px var(--body);fill:var(--ink2)"><tspan fill="${l.c}">●</tspan> ${esc(l.t)}</text>`})}
    host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}"><g class="grid">${g.replace(/<text[^>]*>.*?<\/text>/g,'')}</g><g class="ax">${g.replace(/<line[^>]*\/>/g,'')}${xa}<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/><text x="${m.l+iw/2}" y="${H-4}" text-anchor="middle">${esc(o.xlabel)}</text><text transform="translate(12 ${m.t+ih/2}) rotate(-90)" text-anchor="middle">${esc(o.ylabel)}</text></g>${paths}${lab}<g id="hv" style="display:none"><line y1="${m.t}" y2="${H-m.b}" stroke="var(--ink3)" stroke-dasharray="3 3"/></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
    const hit=$('#hit',host),hv=$('#hv',host),svg=$('svg',host);
    const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,xv=Math.min(xmax,Math.max(0,(px-m.l)/iw*xmax));
      let rows='',dots='';
      o.series.forEach(s=>{let j=0,best=1e9;for(let i=0;i<s.x.length;i++){const d=Math.abs(s.x[i]-xv);if(d<best){best=d;j=i}}
        rows+=`<div><span style="color:${s.color}">●</span> ${esc(s.short)}: ${f(s.y[j],4)} @ ${o.xname} ${f(s.x[j],o.xdec||0)}</div>`;
        dots+=`<circle cx="${sx(s.x[j])}" cy="${sy(s.y[j])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`});
      hv.style.display='';hv.innerHTML=`<line x1="${sx(xv)}" x2="${sx(xv)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink3)" stroke-dasharray="3 3"/>${dots}`;
      showTip(rows,e)};
    hit.addEventListener('pointermove',move);hit.addEventListener('pointerleave',()=>{hv.style.display='none';hideTip()});
  };
  draw();
  if(host._ro)host._ro.disconnect();
  let lw=host.clientWidth;host._ro=new ResizeObserver(()=>{if(Math.abs(host.clientWidth-lw)>1){lw=host.clientWidth;draw()}});host._ro.observe(host);
}

/* ---------- 3D canvas ---------- */
function norm3(B,fi){
  const hub=[B.hub_xy[0],B.hub_xy[1],0],rays=B.frames[fi],all=[hub];rays.forEach(r=>r.forEach(p=>all.push(p)));
  const c=[0,1,2].map(i=>mean(all.map(p=>p[i]))),rms=Math.sqrt(mean(all.map(p=>(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2)))||1;
  const n=p=>[(p[0]-c[0])/rms,(p[1]-c[1])/rms,(p[2]-c[2])/rms];
  return {hub:n(hub),rays:rays.map(r=>r.map(n))};
}
function normCloud(pts){const c=[0,1,2].map(i=>mean(pts.map(p=>p[i]))),rms=Math.sqrt(mean(pts.map(p=>(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2)))||1;return pts.map(p=>[(p[0]-c[0])/rms,(p[1]-c[1])/rms,(p[2]-c[2])/rms])}
function mount3D(){
  const B=D.targets[S.target],cv3=$('#c3d'),ctx=cv3.getContext('2d'),tgt=normCloud(B.target_points);
  const draw=()=>{
    const dpr=window.devicePixelRatio||1,w=cv3.clientWidth,h=cv3.clientHeight;cv3.width=w*dpr;cv3.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    const sc=Math.min(w,h)/2/2.4,cy=Math.cos(S.yaw),sy=Math.sin(S.yaw),cp=Math.cos(S.pitch),sp=Math.sin(S.pitch);
    const P=p=>{const x1=p[0]*cy-p[1]*sy,y1=p[0]*sy+p[1]*cy,y2=y1*cp-p[2]*sp;return [w/2+x1*sc,h/2-y2*sc]};
    ctx.fillStyle=cv('--ink3');ctx.globalAlpha=.55;tgt.forEach(p=>{const [x,y]=P(p);ctx.beginPath();ctx.arc(x,y,2.2,0,6.283);ctx.fill()});ctx.globalAlpha=1;
    const F=norm3(B,S.fold);
    F.rays.forEach((r,i)=>{const col=cv(B.ray_assignments[i]==='M'?'--m':'--v');ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.4;ctx.lineCap='round';
      ctx.beginPath();let [x,y]=P(F.hub);ctx.moveTo(x,y);r.forEach(p=>{[x,y]=P(p);ctx.lineTo(x,y)});ctx.stroke();
      r.forEach(p=>{[x,y]=P(p);ctx.beginPath();ctx.arc(x,y,2.6,0,6.283);ctx.fill()})});
    const [hx,hy]=P(F.hub);ctx.fillStyle=cv('--ink');ctx.beginPath();ctx.arc(hx,hy,4,0,6.283);ctx.fill();
  };
  const upd=()=>{$('#foldv').textContent=`${f(B.fold_amounts[S.fold],2)}${S.fold===B.fold_amounts.indexOf(B.best_fold_amount)?' · evaluator’s best':''}`;draw()};
  $('#fold').oninput=e=>{S.fold=+e.target.value;upd()};
  let drag=null;
  cv3.onpointerdown=e=>{drag=[e.clientX,e.clientY,S.yaw,S.pitch];cv3.setPointerCapture(e.pointerId);cv3.style.cursor='grabbing'};
  cv3.onpointermove=e=>{if(!drag)return;S.yaw=drag[2]+(e.clientX-drag[0])*.01;S.pitch=Math.max(0,Math.min(1.5708,drag[3]+(e.clientY-drag[1])*.01));draw()};
  cv3.onpointerup=()=>{drag=null;cv3.style.cursor='grab'};
  document.querySelectorAll('#views .btn').forEach(b=>b.onclick=()=>{const v=b.dataset.v;S.pitch=v==='top'?0:v==='side'?1.5708:1.0;S.yaw=v==='top'?0:-0.7;draw()});
  if(cv3._ro)cv3._ro.disconnect();cv3._ro=new ResizeObserver(draw);cv3._ro.observe(cv3);
  window._redraw3d=draw;upd();
}

/* ---------- shell ---------- */
function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===S.tab}">${l}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab});
  const V={overview:vOverview,candidates:vCandidates,designs:vDesigns,experiment:vExperiment,method:vMethod}[S.tab];
  $('#view').innerHTML=V();hideTip();
  bindTargetPicker();
  if(S.tab==='candidates'){document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cand=+b.dataset.c;render()})}
  if(S.tab==='designs')mount3D();
  if(S.tab==='experiment')mountExperiment();
  if(S.tab==='method')mountMethod();
}
function route(){const h=(location.hash||'').slice(1);S.tab=TABS.some(t=>t[0]===h)?h:'overview';render()}
$('#badges').innerHTML=`<span class="badge ${D.tests.ok?'ok':'warn'}">${D.tests.ok?'25 unit tests pass':'tests failing'}</span><span class="badge">${D.parameters.n_trials} trials × ${D.parameters.n_iterations} iterations</span><span class="badge warn">fold model simplified</span>`;
addEventListener('hashchange',route);
new MutationObserver(()=>{if(window._redraw3d&&S.tab==='designs')window._redraw3d();if(S.tab==='experiment')mountExperiment()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.tab==='designs'&&window._redraw3d)window._redraw3d();if(S.tab==='experiment')mountExperiment()});
route();
</script>
